services:
  mysql:
    image: mysql:8.0.42
    container_name: medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_ai}
      MYSQL_USER: ${MYSQL_USER:-medical}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    ports:
      - "3306:3306"
    volumes:
      - medical_mysql_data:/var/lib/mysql
      - ./init/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: medical-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_redis_me}
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD:-change_redis_me}
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - medical_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  medical_mysql_data:
    name: medical_mysql_data
  medical_redis_data:
    name: medical_redis_data
